[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbomx"
version = "1.0.0"
description = "SBOM scanner and CVE report tool for TIC labs (IoT/automotive/embedded)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sudoninja-noob" }]
keywords = ["sbom", "cyclonedx", "spdx", "cve", "vex", "security", "firmware"]

dependencies = [
    "click>=8.1",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "rich>=13.0",
    "structlog>=24.0",
    "pydantic>=2.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Heavy / platform-sensitive extras. Core tool works without these.
sbom = ["cyclonedx-python-lib>=7.0", "spdx-tools>=0.8"]
binary = ["lief>=0.14", "python-magic>=0.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
all = [
    "cyclonedx-python-lib>=7.0",
    "spdx-tools>=0.8",
    "lief>=0.14",
    "python-magic>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
sbomx = "sbomx.cli:main"

[project.urls]
Homepage = "https://github.com/sudoninja-noob/sbomx"
Repository = "https://github.com/sudoninja-noob/sbomx"

[tool.hatch.build.targets.wheel]
packages = ["sbomx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
